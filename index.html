<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle Dark/Light Mode">
        🌙 Dark Mode
      </button>
    </header>

    <section class="card balance-card">
      <p class="balance-label">TOTAL BALANCE</p>
      <h2 id="total-balance" class="balance-amount">$0.00</h2>
    </section>

    <section class="card form-card">
      <h3>Add Transaction</h3>
      <form id="transaction-form" novalidate>
        <div class="form-group">
          <label for="currency-select">Currency</label>
          <select id="currency-select" aria-label="Select currency">
            <option value="USD">USD ($) — US Dollar</option>
            <option value="IDR">IDR (Rp) — Indonesian Rupiah</option>
            <option value="EUR">EUR (€) — Euro</option>
            <option value="JPY">JPY (¥) — Japanese Yen</option>
            <option value="GBP">GBP (£) — British Pound</option>
            <option value="SGD">SGD (S$) — Singapore Dollar</option>
            <option value="AUD">AUD (A$) — Australian Dollar</option>
            <option value="KRW">KRW (₩) — South Korean Won</option>
            <option value="MYR">MYR (RM) — Malaysian Ringgit</option>
          </select>
        </div>

        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input
            type="text"
            id="item-name"
            placeholder="e.g., Cilok, Bus Ticket, Cinema"
            required
          />
        </div>

        <div class="form-group">
          <label for="item-amount" id="amount-label">Amount ($)</label>
          <input
            type="number"
            id="item-amount"
            placeholder="0.00"
            step="0.01"
            min="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="item-category">Category</label>
          <select id="item-category" required></select>
        </div>

        <div class="custom-category-box">
          <input
            type="text"
            id="new-category-input"
            placeholder="New category (optional, e.g., Bills)"
          />
          <button type="button" id="add-category-btn" class="btn-secondary">
            + Add Category
          </button>
        </div>

        <p id="form-error" class="error-msg" aria-live="polite"></p>

        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <div class="dashboard-grid">
      <section class="card transactions-card">
        <div class="card-header-row">
          <h3>Transactions</h3>
          <select id="sort-transactions" class="sort-select" aria-label="Sort transactions">
            <option value="newest">Newest</option>
            <option value="amount-desc">Highest</option>
            <option value="amount-asc">Lowest</option>
            <option value="category">Category</option>
          </select>
        </div>

        <div id="transaction-list" class="transaction-list"></div>
      </section>

      <section class="card chart-card">
        <h3>Spending by Category</h3>
        <div class="chart-wrapper">
          <canvas id="expense-chart"></canvas>
          <p id="empty-chart-msg" class="empty-state">No expenses recorded yet.</p>
        </div>
      </section>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
